[project]
name = "tinygrad_unet"
version = "0.0.1"
license = "MIT"
dependencies = [
    "Pillow",
    "tinygrad",
    "numpy"
]

[tool.setuptools]
packages = [
    "tinygrad_unet.dataset",
    "tinygrad_unet.net",
    "tinygrad_unet.inference",
    "tinygrad_unet.util",
    "scripts"
]

[tool.pyright]
include = ["tinygrad_unet", "scripts", "tests", "extra"]
extraPaths = ["tinygrad"]

[tool.pytest.ini_options]
pythonpath = ["."]
